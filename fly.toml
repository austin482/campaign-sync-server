# fly.toml — Fly.io deployment config for CampaignSync server
app = "campaign-sync-server"
primary_region = "sin"  # Singapore — closest to Malaysia

[build]

[http_service]
  internal_port = 3000
  force_https   = true
  auto_stop_machines  = "stop"
  auto_start_machines = true
  min_machines_running = 0

[[vm]]
  memory = "256mb"
  cpu_kind = "shared"
  cpus = 1
